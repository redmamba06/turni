<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
  <meta name="theme-color" content="#2563EB" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Turni" />
  <title>Turni Gelateria</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/favicon-64.png" sizes="64x64" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <!-- Blocco PIN -->
  <div id="lock" class="lock hidden">
    <div class="lock-inner">
      <div class="lock-logo">🍦</div>
      <h1>Turni</h1>
      <p id="lock-msg">Inserisci il PIN</p>
      <div class="pin-dots" id="pin-dots"></div>
      <div class="pin-pad" id="pin-pad"></div>
      <button class="link-btn hidden" id="lock-bio">Sblocca con Face ID / impronta</button>
    </div>
  </div>

  <!-- Accesso (email + password) -->
  <div id="auth" class="auth-screen hidden"></div>

  <!-- App -->
  <div id="app" class="app hidden">
    <header class="topbar">
      <h1 id="page-title">Ciao 👋</h1>
      <button id="btn-today" class="chip-btn hidden">Oggi</button>
    </header>

    <main id="view" class="view"></main>

    <nav class="tabbar">
      <button class="tab" data-tab="home">
        <svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>
        <span>Home</span>
      </button>
      <button class="tab" data-tab="calendar">
        <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>
        <span>Calendario</span>
      </button>
      <button class="tab fab" data-tab="add" aria-label="Aggiungi turno">
        <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
      </button>
      <button class="tab" data-tab="stats">
        <svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
        <span>Statistiche</span>
      </button>
      <button class="tab" data-tab="settings">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.1-1.3l2-1.6-2-3.4-2.4 1a7 7 0 0 0-2.2-1.3L14 2h-4l-.3 2.4a7 7 0 0 0-2.2 1.3l-2.4-1-2 3.4 2 1.6A7 7 0 0 0 5 12a7 7 0 0 0 .1 1.3l-2 1.6 2 3.4 2.4-1a7 7 0 0 0 2.2 1.3L10 22h4l.3-2.4a7 7 0 0 0 2.2-1.3l2.4 1 2-3.4-2-1.6c.1-.4.1-.9.1-1.3z"/></svg>
        <span>Impostazioni</span>
      </button>
    </nav>
  </div>

  <!-- Sheet modale generico -->
  <div id="sheet" class="sheet-backdrop hidden">
    <div class="sheet" id="sheet-body"></div>
  </div>

  <!-- Toast -->
  <div id="toast" class="toast hidden"></div>

  <script src="js/vendor/jspdf.umd.min.js"></script>
  <script src="js/store.js"></script>
  <script src="js/cloud.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
